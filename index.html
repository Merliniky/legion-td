<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b2440">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>军团战争 Legion TD Mega 3.41 · 手机复刻</title>
<meta name="description" content="魔兽争霸3 军团战争（Legion TD Mega 3.41）手机复刻：16个种族、全部兵种与技能、31波怪物、派兵、国王与木材经济。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=18">
<link rel="stylesheet" href="td.css?v=18">
<link rel="stylesheet" href="lt.css?v=18">
</head>
<body class="td lt">
<canvas id="cv"></canvas>
<div id="ltHud" class="hidden">
  <div class="hrow">
    <div class="pill"><span class="lbl">波次</span><b id="hWave">1</b><i class="dim">/31</i></div>
    <div class="pill" id="pTimer"><span class="ic">⏱</span><b id="hTimer">45</b></div>
    <div class="pill" id="pMode"><b id="hMode">X3</b></div>
    <button class="pill btn" id="speedBtn">1×</button>
    <button class="pill btn" id="pauseBtn">⏸</button>
  </div>
  <div class="hrow">
    <div class="pill res" id="pGold"><span class="ic">💰</span><b id="hGold">0</b></div>
    <div class="pill res" id="pLum"><span class="ic">🌲</span><b id="hLum">0</b></div>
    <div class="pill res" id="pInc"><span class="ic">📈</span><b id="hInc">+0</b></div>
    <div class="pill res" id="pFood"><span class="ic">🍖</span><b id="hFood">0/7</b></div>
  </div>
  <div class="hrow2">
    <div class="kbar me"><span class="kn">👑 我方</span><div class="kb"><i id="kMe"></i></div><b id="kMeT">2600</b></div>
    <button class="kbar opp" id="oppBtn"><span class="kn" id="oppName">🤖 对手</span><div class="kb"><i id="kOpp"></i></div><b id="kOppT">2600</b><span class="eye" id="eyeT">👁 观战</span></button>
  </div>
  <div id="nextInfo"></div>
</div>
<div id="viewTag" class="hidden">👁 正在观看对手战线 · 点「返回」回到你的战线</div>
<div id="ltPanel" class="hidden">
  <div class="tabs">
    <button class="tab on" data-tab="build">⚔ 建造</button>
    <button class="tab" data-tab="eco">🌲 经济</button>
    <button class="tab" data-tab="merc">🐺 派兵</button>
    <button class="tab" data-tab="king">👑 国王</button>
    <button class="dbtn go" id="goBtn">▶ 开战</button>
  </div>
  <div class="tbody" id="tBuild"><div class="grid g3" id="rosterGrid"></div><div class="phint" id="bHint">选择兵种，再点战线上的空格建造</div></div>
  <div class="tbody hidden2" id="tEco"><div id="ecoBox"></div></div>
  <div class="tbody hidden2" id="tMerc"><div class="grid scroll" id="mercGrid"></div><div class="phint" id="mHint">派出的兵会在下一波进攻对手，并永久增加你的收入（消耗木材）</div></div>
  <div class="tbody hidden2" id="tKing"><div id="kingBox"></div></div>
  <div id="infoBox" class="hidden2"></div>
</div>
<div id="toasts"></div>
<div id="flash"></div>
<div id="banner2"></div>
<div id="labels"></div>
<div id="ltTitle" class="overlay show">
  <div class="logo"><div class="l1">军团战争</div><div class="l2">LEGION TD MEGA 3.41 · 手机复刻</div></div>
  <div class="modeRow"><span>模式</span><button class="mbtn on" data-mode="X3">X3 原版<small>每波36只</small></button><button class="mbtn" data-mode="X1">X1 简化<small>数量⅓ 赏金×3</small></button></div>
  <div class="raceHint">选择你的种族（建造者）</div>
  <div class="raceGrid" id="raceGrid"></div>
  <div class="raceInfo" id="raceInfo"></div>
  <button class="big-btn" id="startBtn" disabled>加载中…</button>
  <div class="foot">数据提取自 Legion TD Mega 3.41 地图 · 模型复用「英雄冲突」素材（CC0，见 CREDITS.md）</div>
</div>
<div id="ltPause" class="overlay">
  <div class="go-title">已暂停</div>
  <div class="tbtns col"><button class="big-btn" id="resumeBtn">▶ 继续</button><button class="dbtn blue" id="restartBtn">↻ 重新选择种族</button><button class="dbtn stone" id="muteBtn">🔊 声音：开</button></div>
</div>
<div id="ltOver" class="overlay">
  <div class="go-title" id="oTitle">胜利</div>
  <div class="go-sub" id="oSub"></div>
  <div class="tbtns col"><button class="big-btn" id="againBtn">再来一局</button></div>
</div>
<div id="showTitle" class="hidden"></div>
<script src="audio.js?v=1"></script>
<script src="lt_core.js?v=18"></script>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/addons/"}}</script>
<script type="module" src="lt.js?v=18"></script>
</body>
</html>
